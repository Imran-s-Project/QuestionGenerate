<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Question Generate</title>
<meta name="theme-color" content="#1d6b7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="center"><div class="spinner" role="status" aria-label="Loading"></div></div>

<main id="auth" class="center" hidden>
  <form id="authForm" class="card auth-card">
    <div class="brand"><img src="assets/icons/icon.svg" alt="" width="44" height="44"><div><h1 data-brand="name"></h1><p data-brand="tagline"></p></div></div>
    <label><span data-i18n="auth.email"></span><input id="email" type="email" autocomplete="email" required></label>
    <label><span data-i18n="auth.password"></span><input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
    <p id="authMsg" class="msg" role="alert"></p>
    <button class="btn primary" type="submit" data-i18n="auth.signin"></button>
    <button class="btn" id="signUp" type="button" data-i18n="auth.signup"></button>
    <button class="btn" id="google" type="button" data-i18n="auth.google"></button>
    <button class="link" type="button" data-lang-toggle>English / বাংলা</button>
  </form>
</main>

<div id="shell" hidden>
  <aside id="sidebar">
    <div class="brand sm"><img src="assets/icons/icon.svg" alt="" width="32" height="32"><strong data-brand="name"></strong></div>
    <select id="orgSwitch" class="sw" hidden></select>
    <nav id="nav" aria-label="Main"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      <h2 id="pageTitle"></h2>
      <span id="net" class="pill"></span>
      <button class="link" data-lang-toggle>EN / বাং</button>
      <button id="signOut" class="btn sm" data-i18n="auth.signout"></button>
    </header>
    <section id="view" tabindex="-1"></section>
  </div>
  <nav id="bottomNav" aria-label="Primary"></nav>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
